services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: phr
      POSTGRES_PASSWORD: phr
      POSTGRES_DB: phr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://phr:phr@db:5432/phr
      STORAGE_ROOT: /data/documents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seed:/seed
      - documents:/data/documents

  worker:
    build: ./backend
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://phr:phr@db:5432/phr
      STORAGE_ROOT: /data/documents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/data/documents

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  documents:
